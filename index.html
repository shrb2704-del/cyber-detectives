  .e { font-family: var(--emoji); }

  /* header */
  header { position: absolute; top: 0; left: 0; right: 0; height: 110px; display: flex; align-items: center; gap: 22px; padding: 0 28px; z-index: 5; }
  .logo { width: 84px; height: 96px; background: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none; }
  .logo img { height: 82px; }
  .casepill { background: var(--yellow); color: var(--navy); font: 900 24px var(--head); padding: 12px 28px; border-radius: 40px; white-space: nowrap; }
  .score { margin-left: auto; display: flex; gap: 14px; }
  .team { background: var(--panel); border: 3px solid var(--line); border-radius: 20px; padding: 8px 18px; font: 700 22px var(--body); display: flex; align-items: center; gap: 10px; transition: all .3s; }
  .team b { font: 900 34px var(--head); color: var(--yellow); min-width: 34px; text-align: center; }
  .team.active { border-color: var(--cyan); box-shadow: 0 0 24px rgba(34,211,238,.6); transform: scale(1.06); }
  .minishield { width: 74px; height: 89px; flex: none; }

  main { position: absolute; top: 110px; left: 0; right: 0; bottom: 92px; padding: 10px 56px; z-index: 2; overflow: hidden; }
  main > * { transform-origin: top center; }
  footer { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; display: flex; align-items: center; gap: 16px; padding: 0 28px; z-index: 6; }
  .ctl { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--line); background: var(--panel); color: var(--white); font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .ctl:active { transform: scale(.92); }
  .progress { flex: 1; height: 16px; background: var(--panel); border-radius: 10px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width .6s; }
  .turn { font: 700 24px var(--body); color: var(--mist); white-space: nowrap; }
  .turn b { color: var(--white); }

  /* generic */
  h1 { font: 900 60px/1.05 var(--head); margin: 0 0 14px; }
  h2 { font: 900 56px/1.08 var(--head); margin: 0 0 14px; }
  .lead { font: 700 32px/1.3 var(--body); color: var(--yellow); margin: 0 0 18px; }
  .btn { border: none; border-radius: 26px; padding: 22px 40px; font: 900 32px var(--head); color: var(--navy); background: var(--yellow); cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,.35); transition: transform .1s; }
  .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .btn.cyan { background: var(--cyan); } .btn.green { background: var(--green); } .btn.ghost { background: var(--panel2); color: var(--white); }
  .row { display: flex; gap: 26px; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 100%; }
  .pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-14px); } 40%,80% { transform: translateX(14px); } }
  .fadeup { animation: fadeup .5s both; }
  @keyframes fadeup { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* start */
  .start { display: grid; grid-template-columns: 1fr 500px; min-height: 100%; align-items: center; gap: 30px; }
  .start .kids { width: 100%; -webkit-mask-image: radial-gradient(ellipse 70% 72% at 50% 50%, #000 58%, transparent 100%); mask-image: radial-gradient(ellipse 70% 72% at 50% 50%, #000 58%, transparent 100%); }
  .choice { display: flex; gap: 18px; margin: 8px 0 20px; }
  .opt { padding: 18px 30px; border-radius: 22px; border: 4px solid var(--line); background: var(--panel); font: 900 28px var(--head); color: var(--white); cursor: pointer; }
  .opt.on { border-color: var(--cyan); background: var(--panel2); box-shadow: 0 0 22px rgba(34,211,238,.45); }
  .label { font: 700 22px var(--body); color: var(--mist); letter-spacing: 3px; text-transform: uppercase; }

  /* phone */
  .phone { background: var(--panel); border: 4px solid var(--cyan); border-radius: 36px; padding: 20px; width: 780px; }
  .phead { background: var(--panel2); border-radius: 22px; padding: 14px 18px; display: flex; align-items: center; gap: 16px; font: 700 30px var(--body); }
  .ava { width: 68px; height: 68px; border-radius: 50%; background: var(--cyan); display: flex; align-items: center; justify-content: center; font-size: 38px; }
  .bubble { background: #F2F5FF; color: var(--navy); border-radius: 22px; padding: 18px 26px; margin-top: 18px; font: 600 35px/1.4 var(--body); }
  .bubble small { display: block; font: 700 22px var(--body); color: #C2185B; margin-bottom: 4px; }
  .w { border-radius: 10px; padding: 0 4px; cursor: pointer; transition: background .2s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .w.tap { background: rgba(34,211,238,.18); outline: 2px dashed rgba(53,87,214,.45); }
  .w.found { background: var(--yellow); outline: none; }
  .w.nope { background: rgba(255,77,94,.25); }

  /* signal buttons */
  .signals { display: flex; flex-direction: column; gap: 26px; width: 610px; }
  .sig { display: flex; align-items: center; gap: 22px; padding: 20px 28px; border-radius: 30px; border: none; color: var(--navy); font: 900 36px var(--head); cursor: pointer; text-align: left; box-shadow: 0 8px 0 rgba(0,0,0,.35); }
  .sig .e { width: 100px; height: 100px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 56px; flex: none; }
  .sig:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .sig.red { background: var(--red); } .sig.green { background: var(--green); } .sig.yellow { background: var(--yellow); }
  .sig small { display: block; font: 700 23px var(--body); }

  /* quiz */
  .opts { display: flex; flex-direction: column; gap: 24px; }
  .qo { display: flex; align-items: center; gap: 22px; background: var(--panel); border: 4px solid var(--line); border-radius: 28px; padding: 22px 28px; font: 600 35px/1.3 var(--body); color: var(--white); cursor: pointer; text-align: left; }
  .qo .L { width: 84px; height: 84px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font: 900 36px var(--head); color: var(--navy); }
  .qo.ok { border-color: var(--green); background: #12402B; }
  .qo.bad { border-color: var(--red); background: #4A1622; }

  /* sort */
  .items { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; min-height: 200px; align-content: flex-start; }
  .item { background: var(--panel2); border: 4px solid var(--cyan); border-radius: 24px; padding: 18px 26px; font: 700 31px var(--body); display: flex; align-items: center; gap: 14px; cursor: grab; touch-action: none; }
  .item .e { font-size: 48px; }
  .item.sel { border-color: var(--yellow); box-shadow: 0 0 26px rgba(255,201,60,.7); transform: scale(1.06); }
  .item.drag { position: fixed; z-index: 100; pointer-events: none; transform: scale(1.1); }
  .bins { display: flex; gap: 40px; justify-content: center; margin-top: 22px; }
  .bin { width: 640px; min-height: 290px; border-radius: 36px; border: 5px dashed var(--line); background: rgba(22,33,63,.8); display: flex; flex-direction: column; align-items: center; padding: 16px; cursor: pointer; transition: all .2s; }
  .bin .bt { font: 900 34px var(--head); display: flex; align-items: center; gap: 12px; }
  .bin .bt .e { font-size: 54px; }
  .bin .got { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; font: 600 24px var(--body); }
  .bin .got span { background: var(--panel2); border-radius: 14px; padding: 6px 12px; }
  .bin.hot { border-color: var(--yellow); transform: scale(1.03); }

  /* feedback overlay */
  .fb { position: absolute; inset: 0; background: rgba(5,9,20,.82); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .fbcard { width: 1100px; border-radius: 40px; padding: 40px 54px; text-align: center; background: var(--panel); border: 6px solid var(--green); }
  .fbcard.bad { border-color: var(--yellow); }
  .fbcard .big { font-size: 110px; line-height: 1; }
  .fbcard h2 { margin-top: 12px; }
  .fbcard p { font: 600 34px/1.4 var(--body); color: var(--mist); margin: 8px 0 30px; }
  .fbcard p b { color: var(--white); }

  /* shield screen */
  .shieldbig { width: 380px; height: 456px; }
  .rule { font: 900 46px/1.15 var(--head); margin-top: 18px; }
  .stars { font-size: 44px; letter-spacing: 6px; }

  /* order */
  .steps { display: flex; gap: 26px; justify-content: center; margin-top: 30px; }
  .step { width: 450px; min-height: 330px; border-radius: 34px; background: var(--panel); border: 5px solid var(--line); padding: 24px; cursor: pointer; text-align: center; }
  .step .e { font-size: 90px; }
  .step h3 { font: 900 38px var(--head); margin: 8px 0; }
  .step div.t { font: 600 27px/1.3 var(--body); color: var(--mist); }
  .step .n { font: 900 40px var(--head); color: var(--navy); background: var(--yellow); width: 64px; height: 64px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
  .step.done { border-color: var(--green); background: #12402B; }

  canvas#confetti { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
  .hint { font: 600 24px var(--body); color: var(--mist); }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div class="bgcity"></div>
  <header id="hdr"></header>
  <main id="main"></main>
  <footer id="ftr"></footer>
  <canvas id="confetti" width="1600" height="900"></canvas>
</div></div>

// ---------------- state ----------------
const S = { age: "junior", mode: 2, teams: [], li: 0, ti: 0, turn: 0, shield: [], step: "start", tries: 0, sound: true, stats: 0, total: 0 };
const $ = (sel, el = document) => el.querySelector(sel);
const H = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const main = $("#main"), hdr = $("#hdr"), ftr = $("#ftr");

// ---------------- scale stage to screen ----------------
let SCALE = 1;
function fit() { SCALE = Math.min(innerWidth / 1600, innerHeight / 900); $("#stage").style.transform = `scale(${SCALE})`; }
addEventListener("resize", fit); fit();

// ---------------- sound ----------------
let AC;
function tone(freqs, dur = 0.14, type = "sine", gap = 0.11, vol = 0.18) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
    });
  } catch (e) {}
}
const sfx = {
  ok: () => tone([523, 659, 784, 1046], 0.18, "triangle"),
  bad: () => tone([300, 220], 0.25, "sawtooth", 0.18, 0.08),
  tap: () => tone([660], 0.07, "triangle", 0, 0.1),
  shield: () => tone([392, 523, 659, 784, 1046, 1318], 0.28, "triangle", 0.13),
};

// ---------------- confetti ----------------
function confetti(ms = 2500) {
  const cv = $("#confetti"), cx = cv.getContext("2d");
  const cols = ["#22D3EE", "#FFC93C", "#FF5CA8", "#2ED573", "#FF4D5E", "#FFFFFF"];
  const P = Array.from({ length: 160 }, () => ({ x: Math.random() * 1600, y: -20 - Math.random() * 400, vx: (Math.random() - .5) * 6, vy: 4 + Math.random() * 6, r: 6 + Math.random() * 8, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6 }));
  const end = performance.now() + ms;
  (function f(t) {
    cx.clearRect(0, 0, 1600, 900);
    P.forEach((p) => { p.x += p.vx; p.y += p.vy; p.a += 0.15; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); });
    if (t < end) requestAnimationFrame(f); else cx.clearRect(0, 0, 1600, 900);
  })(performance.now());
}

// ---------------- shield svg ----------------
function shieldSVG(lit, cls = "", nums = true) {
  const P = "M200 10 L380 70 V230 C380 360 300 430 200 470 C100 430 20 360 20 230 V70 Z";
  const q = [[0, 0, 193, 228], [207, 0, 400, 228], [0, 242, 193, 480], [207, 242, 400, 480]];
  const c = [[100, 135], [300, 135], [105, 320], [295, 320]];
  const id = "s" + Math.random().toString(36).slice(2, 7);
  let g = `<defs><clipPath id="${id}"><path d="${P}"/></clipPath><filter id="${id}g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>`;
  q.forEach(([x0, y0, x1, y1], k) => {
    const on = lit.includes(k);
    const col = on ? SHIELD_COL[k] : "#3A4466";
    if (on) g += `<g clip-path="url(#${id})" filter="url(#${id}g)" opacity=".75"><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="${col}"/></g>`;
    g += `<g clip-path="url(#${id})"><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="${col}"/><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${(y1 - y0) * .35}" fill="#fff" opacity="${on ? .18 : .06}"/></g>`;
    if (nums) g += `<text x="${c[k][0]}" y="${c[k][1]}" font-family="Segoe UI Black, Arial Black" font-size="86" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="${on ? "#0C142A" : "#8A94B8"}">${k + 1}</text>`;
  });
  return `<svg class="${cls}" viewBox="0 0 400 480">${g}</svg>`;
}

// ---------------- chrome (header/footer) ----------------
function levels() { return LEVELS[S.age]; }
function taskCount() { return levels().reduce((n, l) => n + l.tasks.length, 0) + 1; }
function doneCount() { let n = 0; for (let i = 0; i < S.li; i++) n += levels()[i].tasks.length; return n + S.ti; }
function drawChrome(caseText) {
  const teams = S.mode === 2 ? S.teams.map((t, i) => `<div class="team ${i === S.turn ? "active" : ""}"><span class="e">${t.e}</span>${t.name}<b>${t.score}</b></div>`).join("")
    : `<div class="team active"><span class="e">⭐</span>Класс<b>${S.teams[0].score}</b></div>`;
  hdr.innerHTML = `<div class="logo"><img src="${IMG.logo}" alt="Империя знаний"></div>` +
    (caseText ? `<div class="casepill">${caseText}</div>` : "") +
    (S.step === "start" ? "" : `<div class="score">${teams}</div><div class="minishield">${shieldSVG(S.shield, "", false)}</div>`);
  const pct = S.step === "start" ? 0 : Math.round(100 * doneCount() / taskCount());
  const turn = S.mode === 2 && S.step === "task" ? `<div class="turn">Отвечает: <b><span class="e">${S.teams[S.turn].e}</span> ${S.teams[S.turn].name}</b></div>` : "";
  ftr.innerHTML = `<button class="ctl" id="home" title="В начало"><span class="e">🏠</span></button>
    <button class="ctl" id="snd" title="Звук"><span class="e">${S.sound ? "🔊" : "🔇"}</span></button>
    ${turn}<div class="progress"><i style="width:${pct}%"></i></div>
    <button class="ctl" id="skip" title="Пропустить"><span class="e">⏭️</span></button>
    <button class="ctl" id="fs" title="Во весь экран"><span class="e">⛶</span></button>`;
  $("#home").onclick = () => { if (S.step === "start" || confirm("Начать игру заново?")) start(); };
  $("#snd").onclick = () => { S.sound = !S.sound; drawChrome(caseText); };
  $("#skip").onclick = () => { if (S.step === "task") next(); else if (S.step === "shield") nextLevel(); };
  $("#fs").onclick = () => { const d = document.documentElement; if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen).call(d); else document.exitFullscreen(); };
}

// ---------------- screens ----------------
function start() {
  S.step = "start"; S.shield = []; S.li = 0; S.ti = 0; S.turn = 0;
  drawChrome("");
  main.innerHTML = `<div class="start fadeup">
    <div>
      <div class="label">Миссия: Безопасность · Станция № 3</div>

function intro() {
  S.step = "intro";
  const L = levels()[S.li];
  drawChrome(L.case);
  main.innerHTML = `<div class="center pop">
    <div class="e" style="font-size:120px">${["🕵️", "🔐", "🎁", "💬"][S.li]}</div>

function award(ok) {
  if (ok) { S.teams[S.mode === 2 ? S.turn : 0].score++; sfx.ok(); confetti(1400); } else sfx.bad();
}
function feedback(ok, explain, title) {
  const fb = H(`<div class="fb"><div class="fbcard pop ${ok ? "" : "bad"}">
    <div class="big e">${ok ? "🎉" : "🤔"}</div>
    <h2>${title || (ok ? "Верно, детективы!" : "Почти! Запомним:")}</h2>
    <p>${explain}</p>
    <button class="btn green" id="nx">ДАЛЬШЕ <span class="e">▶️</span></button></div></div>`);
  $("#stage").appendChild(fb);
  $("#nx", fb).onclick = () => { fb.remove(); next(); };
}
function next() {
  $(".fb")?.remove();
  if (S.mode === 2) S.turn = 1 - S.turn;
  S.ti++;
  if (S.li >= levels().length) return final();
  if (S.ti >= levels()[S.li].tasks.length) return shieldScreen();
  task();
}

function msgBox(t) {
  if (t.prize) return `<div class="phone" style="border-color:var(--yellow);background:#8B3DFF;width:820px">
      <div style="display:flex;gap:18px;align-items:center"><img src="${IMG.chest}" style="width:210px;border-radius:20px"><div style="font:900 52px var(--head);color:var(--yellow)">ПОЗДРАВЛЯЕМ!</div></div>
      <div class="bubble" style="background:transparent;color:#fff;font-size:36px;margin-top:6px" id="msg"></div>
      <div style="text-align:center;margin-top:10px"><span style="display:inline-block;background:var(--green);color:var(--navy);font:900 30px var(--head);padding:14px 40px;border-radius:40px">ПОЛУЧИТЬ ПРИЗ</span></div>
      <div style="text-align:right;font:600 16px var(--body);color:#E6DAFF;margin-top:8px">вымышленное сообщение</div></div>`;
  if (t.card) return `<div class="phone" style="width:780px;text-align:center;padding:40px"><div class="e" style="font-size:150px">${t.card}</div><div class="bubble" id="msg" style="font-size:38px">${t.text}</div></div>`;
  return `<div class="phone"><div class="phead"><div class="ava e">${t.ava}</div>${t.from}</div><div class="bubble"><small>${t.from}</small><span id="msg">${t.text || ""}</span></div></div>`;
}

function task() {
  S.step = "task";
  const L = levels()[S.li], t = L.tasks[S.ti];
  drawChrome(L.case);
  ({ signal: tSignal, clues: tClues, quiz: tQuiz, sort: tSort, order: tOrder })[t.type](t);
}

function tSignal(t) {
  main.innerHTML = `<div class="row fadeup" style="min-height:100%;align-items:center;justify-content:space-between">
    <div><h2>Какой сигнал?</h2><p class="lead">Нажми на карточку!</p>${msgBox(t)}</div>
    <div class="signals">${["red", "green", "yellow"].map((k) => `<button class="sig ${k}" data-k="${k}"><span class="e">${SIG[k].e}</span><span>${SIG[k].label}<small>${SIG[k].sub}</small></span></button>`).join("")}</div></div>`;
  main.querySelectorAll(".sig").forEach((b) => (b.onclick = () => {
    const ok = b.dataset.k === t.answer;
    if (!ok) b.classList.add("shake");
    award(ok);
    setTimeout(() => feedback(ok, (ok ? "" : `Правильный сигнал: <b>${SIG[t.answer].e} ${SIG[t.answer].label}</b><br>`) + t.explain), ok ? 500 : 650);
  }));
}

function tClues(t) {
  main.innerHTML = `<div class="row fadeup" style="min-height:100%;align-items:center;justify-content:space-between">
    <div style="width:600px"><h2><span class="e">🔍</span> ${t.prompt}</h2><p class="lead">Нажимай на подозрительные слова в сообщении.</p>
      <div class="stars" id="found"></div><p class="hint" id="hint"></p></div>
    <div>${msgBox(t)}</div></div>`;
  const total = t.parts.filter((p) => p.c).length;
  let found = 0, miss = 0;
  const msg = $("#msg");
  msg.innerHTML = t.parts.map((p, i) => (typeof p === "string" ? p : `<span class="w tap" data-i="${i}">${p.c || p.d}</span>`)).join("");
  const paint = () => ($("#found").innerHTML = Array.from({ length: total }, (_, i) => `<span class="e">${i < found ? "🔎" : "⚪"}</span>`).join(""));
  paint();
  msg.querySelectorAll(".w").forEach((w) => (w.onclick = () => {
    const p = t.parts[w.dataset.i];
    if (w.classList.contains("found")) return;
    if (p.c) { w.classList.remove("tap"); w.classList.add("found"); found++; sfx.tap(); paint(); $("#hint").textContent = "Отлично! Ищем дальше…";
      if (found === total) { award(miss <= 1); setTimeout(() => feedback(true, t.explain, miss <= 1 ? "Все улики найдены!" : "Улики найдены! Будьте внимательнее"), 600); }
    } else { miss++; w.classList.add("nope", "shake"); sfx.bad(); $("#hint").textContent = "Это не улика. Посмотри ещё!"; setTimeout(() => w.classList.remove("shake", "nope"), 700); }
  }));
}

function tQuiz(t) {
  main.innerHTML = `<div class="fadeup" style="min-height:100%;display:flex;flex-direction:column;justify-content:center"><h2>${t.prompt}</h2>
    <div class="opts">${t.options.map((o, i) => `<button class="qo" data-i="${i}"><span class="L" style="background:${["var(--cyan)", "var(--yellow)", "var(--pink)"][i]}">${"АБВ"[i]}</span>${o}</button>`).join("")}</div></div>`;
  let done = false;
  main.querySelectorAll(".qo").forEach((b) => (b.onclick = () => {
    if (done) return; done = true;
    const i = +b.dataset.i, ok = i === t.correct;
    b.classList.add(ok ? "ok" : "bad"); if (!ok) { b.classList.add("shake"); main.querySelector(`.qo[data-i="${t.correct}"]`).classList.add("ok"); }
    award(ok);
    setTimeout(() => feedback(ok, (ok ? "" : `Правильный ответ: <b>${"АБВ"[t.correct]}</b>.<br>`) + t.explain), ok ? 700 : 1300);
  }));
}

function tSort(t) {
  main.innerHTML = `<div class="fadeup"><h2 style="font-size:40px">${t.prompt}</h2>
    <div class="items" id="items">${t.items.map((it, i) => `<div class="item" data-i="${i}"><span class="e">${it.e}</span>${it.t}</div>`).join("")}</div>
    <div class="bins">${t.bins.map((b) => `<div class="bin" data-b="${b.id}"><div class="bt"><span class="e">${b.e}</span>${b.t}</div><div class="got"></div></div>`).join("")}</div></div>`;
  let sel = null, miss = 0, left = t.items.length;
  const place = (el, binId) => {
    const it = t.items[el.dataset.i];
    const bin = main.querySelector(`.bin[data-b="${binId}"]`);
    if (it.b === binId) {
      sfx.tap(); el.remove(); bin.querySelector(".got").insertAdjacentHTML("beforeend", `<span class="pop"><span class="e">${it.e}</span> ${it.t}</span>`);
      if (--left === 0) { award(miss === 0); setTimeout(() => feedback(true, t.explain, miss === 0 ? "Рюкзак собран без ошибок!" : "Готово! Повторим правило:"), 600); }
    } else { miss++; sfx.bad(); el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 500); }
    el.classList.remove("sel"); sel = null;
  };
  main.querySelectorAll(".bin").forEach((b) => (b.onclick = () => { if (sel) place(sel, b.dataset.b); }));
  main.querySelectorAll(".item").forEach((el) => {
    let ghost = null, sx = 0, sy = 0, moved = false;
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); sx = e.clientX; sy = e.clientY; moved = false; el.setPointerCapture(e.pointerId); });
    el.addEventListener("pointermove", (e) => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 12) {
        moved = true; ghost = el.cloneNode(true); ghost.classList.add("drag"); ghost.style.transformOrigin = "0 0";
        ghost.style.transform = `scale(${SCALE * 1.1})`; document.body.appendChild(ghost); el.style.opacity = ".3";
      }
      if (moved) {
        ghost.style.left = e.clientX - 40 * SCALE + "px"; ghost.style.top = e.clientY - 40 * SCALE + "px";
        main.querySelectorAll(".bin").forEach((b) => { const r = b.getBoundingClientRect(); b.classList.toggle("hot", e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom); });
      }
    });
    el.addEventListener("pointerup", (e) => {
      if (moved) {
        ghost.remove(); el.style.opacity = "";
        const hot = main.querySelector(".bin.hot"); main.querySelectorAll(".bin").forEach((b) => b.classList.remove("hot"));
        if (hot) place(el, hot.dataset.b);
      } else {
        main.querySelectorAll(".item").forEach((x) => x.classList.remove("sel"));
        if (sel === el) sel = null; else { sel = el; el.classList.add("sel"); sfx.tap(); }
      }
    });
  });
}

function tOrder(t) {
  const order = [2, 0, 1];
  main.innerHTML = `<div class="fadeup"><h2>${t.prompt}</h2><p class="lead">Нажимай на шаги по порядку: что делаем сначала?</p>
    <div class="steps">${order.map((k) => `<div class="step" data-k="${k}"><div class="e">${t.steps[k].e}</div><h3>${t.steps[k].h}</h3><div class="t">${t.steps[k].t}</div></div>`).join("")}</div>
    <p class="hint" id="hint" style="text-align:center;margin-top:20px"></p></div>`;
  let need = 0, miss = 0;
  main.querySelectorAll(".step").forEach((s) => (s.onclick = () => {
    if (s.classList.contains("done")) return;
    if (+s.dataset.k === need) {
      need++; s.classList.add("done"); s.insertAdjacentHTML("afterbegin", `<div class="n pop">${need}</div>`); sfx.tap();
      if (need === 3) { award(miss === 0); setTimeout(() => feedback(true, t.explain, "Алгоритм собран!"), 700); }
    } else { miss++; sfx.bad(); s.classList.add("shake"); $("#hint").textContent = "Подумай: что нужно сделать раньше?"; setTimeout(() => s.classList.remove("shake"), 500); }
  }));
}

function shieldScreen() {
  S.step = "shield";
  const L = levels()[S.li];
  S.shield = [...S.shield, S.li];
  drawChrome(L.case);
  main.innerHTML = `<div class="center"><div class="label">Дело № ${S.li + 1} раскрыто!</div>
    <div class="pop">${shieldSVG(S.shield, "shieldbig")}</div>
    <div class="rule" style="color:${SHIELD_COL[S.li]}">ЩИТ № ${S.li + 1} — ${L.rule.toUpperCase()}</div>
    <button class="btn" id="go" style="margin-top:22px">${S.li < 3 ? "К СЛЕДУЮЩЕМУ ДЕЛУ" : "ФИНАЛЬНОЕ ЗАДАНИЕ"} <span class="e">▶️</span></button></div>`;
  sfx.shield(); confetti(2600);
  $("#go").onclick = nextLevel;
}
function nextLevel() {
  S.li++; S.ti = 0;
  if (S.li < levels().length) intro();
  else { S.step = "task"; drawChrome("ФИНАЛ · СПАСЕНИЕ КИБЕРГРАДА"); tOrder(FINALE); S.ti = 0; }
}

function final() {
  S.step = "final";
  drawChrome("МИССИЯ ВЫПОЛНЕНА!");
  let winner = "";
  if (S.mode === 2) {
    const [a, b] = S.teams;
    winner = a.score === b.score ? `Ничья! Обе команды — настоящие детективы! <span class="e">🤝</span>` : `Больше всех улик нашли ${a.score > b.score ? a.e + " " + a.name : b.e + " " + b.name}!`;
  } else winner = `Класс заработал ${S.teams[0].score} <span class="e">⭐</span>!`;
  main.innerHTML = `<div class="start"><div class="fadeup">
      <div class="label">Киберград спасён!</div>
      <h1 style="font-size:76px;color:var(--yellow)">МИССИЯ<br>ВЫПОЛНЕНА!</h1>
      <p class="lead" style="color:#fff">${winner}</p>
      <p class="hint" style="font-size:28px;line-height:1.4">Если в интернете случилось что-то странное, неприятное или страшное —<br><b style="color:var(--cyan)">рассказываем взрослому!</b></p>
      <button class="btn cyan" id="again" style="margin-top:16px">ИГРАТЬ ЕЩЁ <span class="e">🔁</span></button>
    </div>
    <div class="center pop">${shieldSVG([0, 1, 2, 3], "shieldbig")}</div></div>`;
  sfx.shield(); confetti(4500);
  $("#again").onclick = start;
}

// FINALE "next" goes to final screen
const _next = next;
next = function () { if (S.li >= levels().length) { $(".fb")?.remove(); return final(); } _next(); };

function fitMain() {
  const inner = main.firstElementChild; if (!inner) return;
  inner.style.transform = "";
  const availH = main.clientHeight - 20, availW = main.clientWidth - 112;
  const k = Math.min(1, availH / inner.scrollHeight, availW / inner.scrollWidth);
  if (k < 0.999) inner.style.transform = `scale(${k})`;
}
new MutationObserver(() => requestAnimationFrame(fitMain)).observe(main, { childList: true });
addEventListener("resize", () => requestAnimationFrame(fitMain));
if (document.fonts) document.fonts.ready.then(fitMain);
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") $("#nx")?.click(); });
start();
</script>
</body>
</html>
